name: conan-center-pr

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Canonical stable source tag
        required: true
        type: string
      source_commit_sha:
        description: Exact source commit
        required: true
        type: string
      source_workflow_head_sha:
        description: Exact source release-workflow head commit
        required: true
        type: string
      provider_control_sha:
        description: Exact immutable release-control commit
        required: true
        type: string
      github_release_id:
        description: Immutable GitHub release numeric ID
        required: true
        type: string
      source_workflow_run_id:
        description: Successful source release workflow run ID
        required: true
        type: string
      release_manifest_sha256:
        description: Signed release manifest SHA-256
        required: true
        type: string
      request_uuid:
        description: Deterministic source request UUID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: conan-center-pr-${{ inputs.source_tag }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  verify:
    name: verify immutable source and assemble recipe
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read
    outputs:
      source_tag: ${{ steps.input.outputs.source_tag }}
      source_commit_sha: ${{ steps.input.outputs.source_commit_sha }}
      provider_control_sha: ${{ steps.input.outputs.provider_control_sha }}
      request_uuid: ${{ steps.input.outputs.request_uuid }}
      tree_sha256: ${{ steps.recipe.outputs.tree_sha256 }}
    steps:
      - name: Fail closed unless executing protected main at the dispatched commit
        env:
          EXPECTED_CONTROL_SHA: ${{ inputs.provider_control_sha }}
        run: |
          test "${GITHUB_REF}" = refs/heads/main
          test "${GITHUB_SHA}" = "${EXPECTED_CONTROL_SHA}"
          test "${GITHUB_WORKFLOW_REF}" = \
            yurirocha15/mcp-cpp-sdk-release-control/.github/workflows/conan-center-pr.yml@refs/heads/main
      - name: Checkout only the dispatched publisher commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.provider_control_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Validate exact dispatch and execution context
        id: input
        env:
          DISPATCH_JSON: >-
            {"source_tag":${{ toJSON(inputs.source_tag) }},"source_commit_sha":${{ toJSON(inputs.source_commit_sha) }},"source_workflow_head_sha":${{ toJSON(inputs.source_workflow_head_sha) }},"provider_control_sha":${{ toJSON(inputs.provider_control_sha) }},"github_release_id":${{ toJSON(inputs.github_release_id) }},"source_workflow_run_id":${{ toJSON(inputs.source_workflow_run_id) }},"release_manifest_sha256":${{ toJSON(inputs.release_manifest_sha256) }},"request_uuid":${{ toJSON(inputs.request_uuid) }}}
        run: python3 -I -S publisher/validate_dispatch.py
      - name: Verify exact source repository, release, and completed workflow
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ steps.input.outputs.source_tag }}
          SOURCE_WORKFLOW_HEAD: ${{ steps.input.outputs.source_workflow_head_sha }}
          RELEASE_ID: ${{ steps.input.outputs.github_release_id }}
          SOURCE_RUN_ID: ${{ steps.input.outputs.source_workflow_run_id }}
          SOURCE_REPOSITORY_ID: ${{ vars.SOURCE_REPOSITORY_ID }}
          SOURCE_OWNER_ID: ${{ vars.SOURCE_OWNER_ID }}
        run: >-
          python3 -I -S publisher/verify_source_state.py
          --source-repository-id "${SOURCE_REPOSITORY_ID}"
          --source-owner-id "${SOURCE_OWNER_ID}"
          --source-tag "${SOURCE_TAG}"
          --source-workflow-head-sha "${SOURCE_WORKFLOW_HEAD}"
          --github-release-id "${RELEASE_ID}"
          --source-workflow-run-id "${SOURCE_RUN_ID}"
      - name: Download exact immutable source release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ steps.input.outputs.source_tag }}
        run: |
          mkdir release-assets
          gh release download "${SOURCE_TAG}" --repo yurirocha15/mcp-cpp-sdk --dir release-assets
      - name: Verify signed source bundle and Conan destination
        env:
          SOURCE_TAG: ${{ steps.input.outputs.source_tag }}
          SOURCE_SHA: ${{ steps.input.outputs.source_commit_sha }}
          MANIFEST_SHA256: ${{ steps.input.outputs.release_manifest_sha256 }}
          PUBLISHER_REPOSITORY_ID: ${{ github.repository_id }}
          PRIMARY_FINGERPRINT: ${{ vars.SOURCE_SIGNING_PRIMARY_FINGERPRINT }}
          TAG_FINGERPRINT: ${{ vars.SOURCE_TAG_SIGNING_SUBKEY_FINGERPRINT }}
          ARTIFACT_FINGERPRINT: ${{ vars.SOURCE_ARTIFACT_SIGNING_SUBKEY_FINGERPRINT }}
        run: >-
          python3 -I -S publisher/verify_source_release.py
          --directory release-assets --tag "${SOURCE_TAG}" --commit "${SOURCE_SHA}"
          --manifest-sha256 "${MANIFEST_SHA256}"
          --primary-fingerprint "${PRIMARY_FINGERPRINT}"
          --tag-fingerprint "${TAG_FINGERPRINT}"
          --artifact-fingerprint "${ARTIFACT_FINGERPRINT}"
          --publisher-repository-id "${PUBLISHER_REPOSITORY_ID}"
          --recipe-output recipe-inputs
      - name: Verify signed annotated source tag
        env:
          SOURCE_TAG: ${{ steps.input.outputs.source_tag }}
          SOURCE_SHA: ${{ steps.input.outputs.source_commit_sha }}
          PRIMARY_FINGERPRINT: ${{ vars.SOURCE_SIGNING_PRIMARY_FINGERPRINT }}
          TAG_FINGERPRINT: ${{ vars.SOURCE_TAG_SIGNING_SUBKEY_FINGERPRINT }}
        run: |
          export GNUPGHOME="${RUNNER_TEMP}/source-gnupg"
          mkdir -m 700 "${GNUPGHOME}"
          gpg --batch --import release-assets/release-signing-key.asc
          git init --bare source.git
          git -C source.git fetch --no-tags --depth=1 https://github.com/yurirocha15/mcp-cpp-sdk.git \
            "refs/tags/${SOURCE_TAG}:refs/tags/${SOURCE_TAG}"
          git -C source.git fetch --no-tags https://github.com/yurirocha15/mcp-cpp-sdk.git \
            refs/heads/main:refs/heads/main
          test "$(git -C source.git cat-file -t "${SOURCE_TAG}")" = tag
          git -C source.git verify-tag --raw "${SOURCE_TAG}" 2>tag.status
          test "$(git -C source.git rev-list -n1 "${SOURCE_TAG}")" = "${SOURCE_SHA}"
          git -C source.git merge-base --is-ancestor "${SOURCE_SHA}" refs/heads/main
          python3 -I -S publisher/verify_git_status.py \
            tag.status "${TAG_FINGERPRINT}" "${PRIMARY_FINGERPRINT}"
      - name: Assemble and verify the recipe on current upstream
        id: recipe
        env:
          SOURCE_TAG: ${{ steps.input.outputs.source_tag }}
        run: |
          git init -q upstream
          git -C upstream remote add origin https://github.com/conan-io/conan-center-index.git
          git -C upstream fetch -q --depth=1 --filter=blob:none --no-tags origin refs/heads/master
          base="$(git -C upstream rev-parse FETCH_HEAD)"
          upstream_recipe=()
          if git -C upstream cat-file -e "${base}:recipes/mcp-cpp-sdk" 2>/dev/null; then
            mkdir upstream-recipe
            git -C upstream archive --format=tar "${base}:recipes/mcp-cpp-sdk" |
              tar --extract --directory upstream-recipe --no-same-owner --no-same-permissions
            upstream_recipe=(--upstream upstream-recipe)
          fi
          mkdir handoff
          python3 -I -S publisher/assemble_recipe.py --inputs recipe-inputs \
            --version "${SOURCE_TAG#v}" "${upstream_recipe[@]}" --base-commit "${base}" \
            --output handoff/recipe --metadata handoff/recipe.json
          python3 -I -S publisher/verify_recipe_tree.py --tree handoff/recipe \
            --tag "${SOURCE_TAG}" --release-manifest release-assets/release-manifest.json
          echo "tree_sha256=$(jq -r .tree_sha256 handoff/recipe.json)" >>"${GITHUB_OUTPUT}"
          {
            echo "## Verified ConanCenter recipe"
            echo
            echo "Upstream base: \`${base}\` ($(jq -r .state handoff/recipe.json) recipe)"
            echo
            echo '```'
            (cd handoff/recipe && find . -type f | sort)
            echo '```'
          } >>"${GITHUB_STEP_SUMMARY}"
      - name: Upload verified recipe only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-recipe
          path: handoff/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  push:
    name: push the recipe branch to the ConanCenter fork
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: conan-fork-push
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout only the immutable publisher implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.provider_control_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download only this run's verified recipe
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-recipe
          path: handoff
      - name: Create a fork-scoped publisher App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CONAN_FORK_APP_CLIENT_ID }}
          private-key: ${{ secrets.CONAN_FORK_APP_PRIVATE_KEY }}
          owner: yurirocha15
          repositories: conan-center-index
          permission-contents: write
      - name: Push or prove the exact recipe branch
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TREE_SHA256: ${{ needs.verify.outputs.tree_sha256 }}
          SOURCE_SHA: ${{ needs.verify.outputs.source_commit_sha }}
          REQUEST_UUID: ${{ needs.verify.outputs.request_uuid }}
          FORK_REPOSITORY_ID: ${{ vars.CONAN_CENTER_FORK_REPOSITORY_ID }}
          FORK_OWNER_ID: ${{ vars.CONAN_CENTER_FORK_OWNER_ID }}
          UPSTREAM_REPOSITORY_ID: ${{ vars.CONAN_CENTER_UPSTREAM_REPOSITORY_ID }}
        run: >-
          python3 -I -S publisher/push_recipe.py
          --recipe handoff/recipe --metadata handoff/recipe.json
          --expected-tree-sha256 "${TREE_SHA256}"
          --source-commit "${SOURCE_SHA}" --request-uuid "${REQUEST_UUID}"
          --fork-repository-id "${FORK_REPOSITORY_ID}"
          --fork-owner-id "${FORK_OWNER_ID}"
          --upstream-repository-id "${UPSTREAM_REPOSITORY_ID}"
          --summary "${GITHUB_STEP_SUMMARY}"
